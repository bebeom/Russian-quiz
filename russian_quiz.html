<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="러시아어 퀴즈">
<title>러시아어 단어 퀴즈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    background: #0f1117;
    color: #e8e4d8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
  }

  .header {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 4px 16px;
  }
  .app-title { font-size: 18px; font-weight: 700; color: #c8a96e; }
  .score-badge {
    font-size: 13px; color: #8a8799;
    background: #1a1d2e; border: 1px solid rgba(200,169,110,0.25);
    border-radius: 20px; padding: 4px 14px;
  }
  .score-badge span { color: #c8a96e; font-weight: 700; }

  .progress-bar-wrap {
    width: 100%; max-width: 480px; height: 4px;
    background: #1a1d2e; border-radius: 2px; margin-bottom: 24px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #8b6fd4, #c8a96e);
    border-radius: 2px; transition: width 0.4s ease;
  }

  .question-card {
    width: 100%; max-width: 480px;
    background: #1a1d2e; border: 1px solid rgba(200,169,110,0.2);
    border-radius: 20px; padding: 28px 24px;
    margin-bottom: 16px; text-align: center;
  }
  .q-number { font-size: 12px; color: #8b6fd4; margin-bottom: 10px; }
  .q-label { font-size: 11px; letter-spacing: 2px; color: #8a8799; margin-bottom: 14px; }
  .q-word { font-size: 36px; font-weight: 700; color: #e8e4d8; line-height: 1.2; margin-bottom: 8px; }
  .q-hint { font-size: 13px; color: #8a8799; }

  .choices {
    width: 100%; max-width: 480px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
  }
  .choice-btn {
    background: #20243a; border: 1.5px solid rgba(200,169,110,0.2);
    border-radius: 14px; padding: 16px 10px;
    color: #e8e4d8; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 15px; cursor: pointer; text-align: center; line-height: 1.4;
    -webkit-appearance: none; transition: transform 0.1s;
  }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn .ru-text { display: block; font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .choice-btn .trans { display: block; font-size: 11px; color: #8a8799; font-style: italic; }
  .choice-btn.correct { border-color: #4caf82; background: rgba(76,175,130,0.15); color: #4caf82; }
  .choice-btn.wrong { border-color: #e05c5c; background: rgba(224,92,92,0.12); color: #e05c5c; }
  .choice-btn.disabled { pointer-events: none; opacity: 0.4; }
  .choice-btn.correct .trans, .choice-btn.wrong .trans { color: inherit; opacity: 0.7; }

  .feedback {
    width: 100%; max-width: 480px;
    min-height: 50px; text-align: center; font-size: 15px;
    padding: 13px 20px; border-radius: 14px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .feedback.hidden { visibility: hidden; }
  .feedback.ok { background: rgba(76,175,130,0.12); color: #4caf82; border: 1px solid rgba(76,175,130,0.3); }
  .feedback.no { background: rgba(224,92,92,0.08); color: #e05c5c; border: 1px solid rgba(224,92,92,0.25); }

  .next-btn {
    width: 100%; max-width: 480px;
    background: #c8a96e; color: #1a1005; border: none;
    border-radius: 14px; padding: 16px;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: none; -webkit-appearance: none;
  }
  .next-btn:active { transform: scale(0.97); }
  .next-btn.visible { display: block; }

  /* 결과 화면 */
  .result-screen {
    width: 100%; max-width: 480px; text-align: center;
    display: none; flex-direction: column; align-items: center; padding: 20px 0;
  }
  .result-screen.visible { display: flex; }
  .result-emoji { font-size: 60px; margin-bottom: 14px; }
  .result-title { font-size: 26px; font-weight: 700; color: #c8a96e; margin-bottom: 6px; }
  .result-sub { font-size: 14px; color: #8a8799; margin-bottom: 28px; }
  .result-score-big { font-size: 60px; font-weight: 700; color: #e8e4d8; line-height: 1; margin-bottom: 4px; }
  .result-score-label { font-size: 13px; color: #8a8799; margin-bottom: 28px; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-bottom: 28px; }
  .stat-card { background: #1a1d2e; border: 1px solid rgba(200,169,110,0.2); border-radius: 14px; padding: 16px; }
  .stat-card .stat-val { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
  .stat-card .stat-label { font-size: 12px; color: #8a8799; }
  .stat-card.c .stat-val { color: #4caf82; }
  .stat-card.w .stat-val { color: #e05c5c; }
  .restart-btn {
    width: 100%; background: #c8a96e; color: #1a1005; border: none;
    border-radius: 14px; padding: 16px;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer; -webkit-appearance: none;
  }

  .quiz-area { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div class="header">
  <div class="app-title">🇷🇺 러시아어 퀴즈</div>
  <div class="score-badge">점수 <span id="scoreDisplay">0</span></div>
</div>
<div class="progress-bar-wrap">
  <div class="progress-bar" id="progressBar" style="width:0%"></div>
</div>

<div class="quiz-area" id="quizArea">
  <div class="question-card">
    <div class="q-number" id="qNumber">1 / 100</div>
    <div class="q-label">이 단어를 러시아어로?</div>
    <div class="q-word" id="qWord"></div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="feedback hidden" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>
</div>

<div class="result-screen" id="resultScreen">
  <div class="result-emoji" id="resultEmoji">🎉</div>
  <div class="result-title" id="resultTitle">훌륭해요!</div>
  <div class="result-sub" id="resultSub">퀴즈를 완료했습니다</div>
  <div class="result-score-big" id="resultBig">0</div>
  <div class="result-score-label" id="resultLabel">점 / 100점</div>
  <div class="result-stats">
    <div class="stat-card c"><div class="stat-val" id="statC">0</div><div class="stat-label">정답</div></div>
    <div class="stat-card w"><div class="stat-val" id="statW">0</div><div class="stat-label">오답</div></div>
  </div>
  <button class="restart-btn" onclick="restartQuiz()">🔄 다시 풀기</button>
</div>

var shuffled=[], current=0, score=0, correctCnt=0, wrongCnt=0, answered=false;

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=b[i]; b[i]=b[j]; b[j]=t;
  }
  return b;
}

function getWrongs(q){
  var pool=[];
  for(var i=0;i<words.length;i++){if(words[i].ru!==q.ru)pool.push(words[i]);}
  return shuffle(pool).slice(0,3);
}

function loadQ(){
  answered=false;
  var q=shuffled[current];
  document.getElementById('qNumber').textContent=(current+1)+' / '+shuffled.length;
  document.getElementById('qWord').textContent=q.ko;
  document.getElementById('qHint').textContent='['+q.hint+']';
  document.getElementById('progressBar').style.width=((current/shuffled.length)*100)+'%';

  var opts=shuffle([q].concat(getWrongs(q)));
  var el=document.getElementById('choices');
  el.innerHTML='';
  for(var i=0;i<opts.length;i++){
    (function(o){
      var b=document.createElement('button');
      b.className='choice-btn';
      b.innerHTML='<span class="ru-text">'+o.ru+'</span><span class="trans">'+o.tr+'</span>';
      b.onclick=function(){checkAns(o.ru===q.ru,b,q);};
      el.appendChild(b);
    })(opts[i]);
  }

  var fb=document.getElementById('feedback');
  fb.className='feedback hidden'; fb.textContent='';
  document.getElementById('nextBtn').classList.remove('visible');
}

function checkAns(isOk,btn,q){
  if(answered)return;
  answered=true;
  var btns=document.querySelectorAll('.choice-btn');
  for(var i=0;i<btns.length;i++){
    var right=btns[i].querySelector('.ru-text').textContent===q.ru;
    if(right) btns[i].classList.add('correct');
    else if(btns[i]===btn&&!isOk) btns[i].classList.add('wrong');
    else btns[i].classList.add('disabled');
  }
  var fb=document.getElementById('feedback');
  if(isOk){
    score++; correctCnt++;
    document.getElementById('scoreDisplay').textContent=score;
    fb.className='feedback ok'; fb.textContent='✓ 정답입니다!';
  } else {
    wrongCnt++;
    fb.className='feedback no'; fb.textContent='✗ 정답: '+q.ru+' ('+q.tr+')';
  }
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion(){
  current++;
  if(current>=shuffled.length) showResult();
  else loadQ();
}

function showResult(){
  document.getElementById('quizArea').style.display='none';
  document.querySelector('.header').style.display='none';
  document.querySelector('.progress-bar-wrap').style.display='none';
  document.getElementById('resultScreen').classList.add('visible');
  document.getElementById('progressBar').style.width='100%';
  var total=shuffled.length, pct=Math.round((score/total)*100);
  document.getElementById('resultBig').textContent=score;
  document.getElementById('resultLabel').textContent='점 / '+total+'점';
  document.getElementById('statC').textContent=correctCnt;
  document.getElementById('statW').textContent=wrongCnt;
  var emoji,title,sub;
  if(pct>=90){emoji='🏆';title='완벽해요!';sub='러시아어 실력이 대단합니다!';}
  else if(pct>=70){emoji='🎉';title='훌륭해요!';sub='잘 하고 있어요, 계속 연습하세요!';}
  else if(pct>=50){emoji='📚';title='좋아요!';sub='조금 더 연습하면 완벽해질 거예요!';}
  else{emoji='💪';title='계속 도전!';sub='다시 한 번 도전해봐요!';}
  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultSub').textContent=sub;
}

function restartQuiz(){
  score=correctCnt=wrongCnt=current=0;
  document.getElementById('scoreDisplay').textContent='0';
  document.getElementById('resultScreen').classList.remove('visible');
  document.getElementById('quizArea').style.display='flex';
  document.querySelector('.header').style.display='flex';
  document.querySelector('.progress-bar-wrap').style.display='block';
  shuffled=shuffle(words); loadQ();
}

shuffled=shuffle(words); loadQ();

</html>
